name: CI

on:
  pull_request:
  push:
    branches: [main, "lts/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vpn-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 9100:9100 -e VPN_URL=http://127.0.0.1:1 -e VPN_SERVER_TOKEN=ci vpn-server:ci
          for _ in $(seq 1 30); do curl -sf localhost:9100/healthz && break; sleep 1; done
          curl -sf localhost:9100/metrics | grep -q 'openasy_build_info{product="vpn-server"'
          docker exec smoke openvpn --version
          docker logs smoke

  # A real OpenVPN client connects through vpn-server configured by vpn (ADR 0029).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vpn-server

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openasy/vpn
          path: vpn

      - name: Build both images
        run: |
          docker build -t vpn:dev vpn
          docker build -t vpn-server:dev vpn-server

      - name: Connect, reach the internal network, revoke
        run: vpn/e2e/run.sh
